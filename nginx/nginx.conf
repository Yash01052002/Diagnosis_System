# Production edge reverse proxy for BlackBox.
#
# Fronts the whole stack: terminates TLS, redirects HTTP→HTTPS, rate-limits the
# API (aggressively on auth), sets security headers, and routes:
#   /api, /health  → backend:8000
#   /              → frontend:80 (the SPA's own nginx serves the static bundle)
#
# Mounted at /etc/nginx/conf.d/default.conf, which nginx includes inside its
# http{} block — so the limit_req_zone directives below are in http context, as
# required. Replaces the stock default.conf.

# --- Rate-limit zones (http context) ---------------------------------------
# Keyed on the real client IP (see set_real_ip_from / X-Forwarded-For below).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_status 429;

# Trust the immediate proxy for the client IP (adjust to your LB's subnet).
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Docker DNS, so upstreams resolve at request time and nginx starts before them.
resolver 127.0.0.11 valid=30s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- HTTP: redirect everything to HTTPS ------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow ACME HTTP-01 challenges to be served without a redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: the edge --------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Certificates mounted from the host (e.g. Let's Encrypt live dir).
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Modern, conservative TLS.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Uploads: firmware ELF/MAP and documents. Matches MAX_ARTIFACT_SIZE_MB.
    client_max_body_size 256m;

    # --- Security headers (belt-and-braces with the app's own middleware) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Strict CSP: the SPA is same-origin, ships no inline scripts (the theme
    # bootstrap moved into the bundle in Phase 6), and calls only its own API.
    # 'unsafe-inline' is allowed for styles only — inline styles cannot execute.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    # gzip for text payloads.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # --- Auth endpoints: strict rate limit ----------------------------------
    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_common.conf;
    }

    # --- API ----------------------------------------------------------------
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_common.conf;
    }

    location = /health {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_common.conf;
        access_log off;
    }

    # --- SPA (served by the frontend container's nginx) ---------------------
    location / {
        proxy_pass http://frontend:80;
        include /etc/nginx/proxy_common.conf;
    }
}
