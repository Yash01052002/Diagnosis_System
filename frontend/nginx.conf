# nginx config for the BlackBox SPA.
#
# Two jobs:
#   1. Serve the static bundle, falling back to index.html so client-side
#      routes (/crashes/123) work on a hard refresh.
#   2. Reverse-proxy /api to the backend, so the SPA and API share an origin
#      (no CORS) and the frontend's relative "/api/v1" URLs just work.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving the upstream at request time (via the
    # variable below) means nginx starts even if the backend isn't up yet, and
    # picks up its address when it appears.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # The backend service name on the compose network.
    set $backend "http://backend:8000";

    # Long-cache fingerprinted assets; never cache the HTML shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API + docs proxied to the backend.
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # SPA fallback: unknown paths return the app shell, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
