[project]
name = "blackbox-backend"
version = "0.1.0"
description = "BlackBox - AI Powered Crash Diagnosis System for Embedded Firmware (backend API)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "pyelftools>=0.31",
    "numpy>=1.26.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
# The default RAG stack (template LLM + hashing embeddings + database vector
# store) needs nothing beyond the core dependencies. These extras swap in a
# real provider by configuration alone — no code change (see LLM_PROVIDER,
# EMBEDDING_PROVIDER, VECTOR_STORE).
openai = [
    # Uses the REST API directly over httpx; the SDK is not required, but a
    # tokenizer is handy when tuning chunk sizes.
    "tiktoken>=0.7.0",
]
chroma = [
    "chromadb>=0.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# The build service does synchronous file I/O in the upload path on purpose:
# ELF/MAP artifacts are small and uploads are infrequent, so indexing runs
# inline (see BuildService.upload) rather than adding thread-offload machinery.
"app/services/build.py" = ["ASYNC240"]
# Tests read fixture files directly; they are not on the event-loop hot path.
"tests/**" = ["ASYNC240"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
