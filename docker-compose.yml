# BlackBox development stack.
#
#   docker compose up -d --build
#
# Services added in later phases (frontend, ai-service, nginx) are declared in
# docker-compose.override.yml as they land.

name: blackbox

services:
  db:
    image: postgres:16-alpine
    container_name: blackbox-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blackbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blackbox}
      POSTGRES_DB: ${POSTGRES_DB:-blackbox}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_EXPOSED_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blackbox} -d ${POSTGRES_DB:-blackbox}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [blackbox]

  redis:
    image: redis:7-alpine
    container_name: blackbox-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_EXPOSED_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [blackbox]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: blackbox-backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_SERVER: db
      REDIS_URL: redis://redis:6379/0
      ARTIFACT_STORAGE_DIR: /data/artifacts
      # Only consulted when VECTOR_STORE=chroma; harmless otherwise. Points at
      # the optional "chroma" service below (started with --profile chroma).
      # In-network Chroma listens on 8000; the 8001 in .env is the host mapping.
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    volumes:
      # Firmware ELF/MAP files must outlive the container and be shared with
      # the worker, which re-symbolizes crashes out of band.
      - artifact_data:/data/artifacts
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [blackbox]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: blackbox-worker
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_SERVER: db
      REDIS_URL: redis://redis:6379/0
      ARTIFACT_STORAGE_DIR: /data/artifacts
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      # Migrations and seeding are owned by the backend container.
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"
    volumes:
      - artifact_data:/data/artifacts
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      backend: { condition: service_started }
    healthcheck:
      test: ["CMD", "celery", "-A", "app.worker.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [blackbox]

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: blackbox-beat
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_SERVER: db
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO"]
    depends_on:
      redis: { condition: service_healthy }
      backend: { condition: service_started }
    networks: [blackbox]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    container_name: blackbox-frontend
    restart: unless-stopped
    # nginx serves the SPA and reverse-proxies /api to the backend, so the app
    # and API share an origin — no CORS, and the frontend's relative API URLs
    # work unchanged in development and production.
    depends_on:
      backend: { condition: service_started }
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [blackbox]

  # Optional vector store for the RAG engine. The default stack uses the
  # database-backed vector store and needs nothing here; start Chroma only when
  # running VECTOR_STORE=chroma:
  #
  #   docker compose --profile chroma up -d
  #
  chroma:
    image: chromadb/chroma:0.5.5
    container_name: blackbox-chroma
    profiles: [chroma]
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "${CHROMA_EXPOSED_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [blackbox]

volumes:
  postgres_data:
  artifact_data:
  redis_data:
  chroma_data:

networks:
  blackbox:
    driver: bridge
